name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pacman
          POSTGRES_PASSWORD: pacman_ci
          POSTGRES_DB: pacman_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pacman -d pacman_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Apenas o banco descartável do runner, nunca credenciais do Railway.
      TEST_DATABASE_URL: postgres://pacman:pacman_ci@127.0.0.1:5432/pacman_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - name: Action bundle atualizado
        run: |
          pnpm run build:action
          git diff --exit-code github-action/dist/index.js
