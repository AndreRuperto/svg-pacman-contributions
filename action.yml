name: 'Pac-Man Contribution Graph'
description: 'Gera uma animação SVG de Pac-Man a partir do contribution graph do GitHub'
author: 'Andre Ruperto'

inputs:
  github_user_name:
    description: 'Usuário GitHub'
    required: true
  github_token:
    description: 'Token GitHub'
    required: true
  theme:
    description: 'Tema (github, github-dark, brasa, arcade, neon, alto-contraste, gitlab, gitlab-dark)'
    required: false
    default: 'github-dark'
  output_directory:
    description: 'Pasta de saída dos SVGs'
    required: false
    default: 'dist'
  player_style:
    description: 'Estilo do Pac-Man (oportunista, conservador, agressivo)'
    required: false
    default: 'oportunista'
  speed:
    description: 'Velocidade da animação: slow, normal, fast ou um multiplicador (ex.: 1.5)'
    required: false
    default: 'normal'

runs:
  using: node20
  main: github-action/dist/index.js

branding:
  icon: activity
  color: yellow